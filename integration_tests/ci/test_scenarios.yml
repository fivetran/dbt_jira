# Only set these to override the default version ranges:
# dbt_core_version: ">=1.10.0,<2.0.0"
# dbt_core_version_v2: ">=2.0.0,<3.0.0"
# dbt_adapter_versions:
#   snowflake: ">=1.10.0,<2.0.0"
#   bigquery: ">=1.10.0,<2.0.0"
#   postgres: ">=1.10.0,<2.0.0"
#   redshift: ">=1.10.0,<2.0.0"
#   databricks: ">=1.10.0,<2.0.0"
#   duckdb: ">=1.10.0,<2.0.0"

schema_variable_name: "jira_schema"

include_databricks_sql: true
include_sqlserver: false
include_duckdb: true
include_dbt_v2_strict: true

include_dbt_compile: true

# dbt v2 runs only on these warehouses until upstream dbt bugs are fixed:
# - databricks: duplicate partition column breaks int_jira__field_history_scd's full refresh (GA-1044229, dbt-labs/dbt#14264)
# - redshift: view rebuilds fail on the second run (GA-1044262, dbt-labs/dbt#14082)
dbt_v2_warehouses: ["snowflake", "bigquery", "duckdb"]

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: true

  - name: "features disabled field grain"
    vars:
      jira_using_teams: false
      jira_using_priorities: false
      jira_using_sprints: false
      jira_using_components: false
      jira_using_versions: false
      jira_field_grain: 'field_name'
    include_incremental: true

  # Redshift is false by default
  - name: "conversations disabled"
    vars:
      jira_include_conversations: false
    include_incremental: false
    warehouses: ["snowflake", "bigquery", "postgres", "databricks"]

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true
